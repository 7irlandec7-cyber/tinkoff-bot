name: Tinkoff Bot Check

on:
  schedule:
    # Каждые 5 минут, в будни с 7:00 до 16:00 UTC (10:00-19:00 МСК)
    - cron: "*/5 * * * 1-5"
  workflow_dispatch: # можно запустить вручную

env:
  # РЕЖИМ «БЕСКОНЕЧНЫЕ ОПЕРАЦИИ»: закрытие при первом положительном PnL
  # после комиссии. Комиссия round-trip = 2×0.04% = 0.08%,
  # TP = 0.12% (0.08% комиссия + 0.04% чистый профит).
  # MAX_TRADES=999 = без лимита сделок в день.
  SCALPING_STRATEGY: medium_term
  SCALPING_TAKE_PROFIT: 0.12
  SCALPING_STOP_LOSS: 0.3
  SCALPING_CHECK_INTERVAL: 10
  SCALPING_MAX_POSITIONS: 3
  SCALPING_MAX_TRADES: 999
  SCALPING_MIN_HOLD_MINUTES: 0
  SCALPING_MAX_HOLD_MINUTES: 240
  SCALPING_ALLOW_MARGIN: false
  SCALPING_ALLOW_SHORT: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt httpx python-dotenv

      - name: Run bot check (one cycle)
        env:
          TINKOFF_TOKEN: ${{ secrets.TINKOFF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scalping_once.py
